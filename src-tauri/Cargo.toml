[package]
name = "devin-ai-ide-desktop"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# The desktop crate is tiny, while Tauri/WebView dependencies are large.  Full
# MSVC debug symbols plus Cargo incremental objects previously grew the cached
# development target to about 7 GB.  DEVIN uses application logs and Rust unit
# tests for diagnostics, so keep reusable compiled dependencies without those
# multi-gigabyte debug/incremental artifacts.
[profile.dev]
debug = 0
incremental = false
