[package]
name = "devin-ai-ide-desktop"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# The desktop crate is tiny, while Tauri/WebView dependencies are large.  Full
# MSVC debug symbols plus Cargo incremental objects previously grew the cached
# development target to about 7 GB.  DEVIN uses application logs and Rust unit
# tests for diagnostics, so keep reusable compiled dependencies without those
# multi-gigabyte debug/incremental artifacts.
[profile.dev]
debug = 0
incremental = false
