name: Desktop release (Windows)

# Una sola sorgente per l'interfaccia: il repo. L'app desktop la porta
# compilata dentro, quindi a ogni merge su main che tocca UI o shell si
# costruisce qui l'installer e lo si pubblica come release desktop-vX.Y.Z.
# L'app vede la release e propone l'aggiornamento. Sui PR si costruisce e si
# prova soltanto, senza pubblicare.

on:
  push:
    branches: [main]
    paths:
      - 'devin/ui/static/**'
      - 'devin/ui/templates/codex_app.html'
      - 'src-tauri/**'
      - 'scripts/build-frontend-bundle.ps1'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'
  pull_request:
    paths:
      - 'devin/ui/static/**'
      - 'devin/ui/templates/codex_app.html'
      - 'src-tauri/**'
      - 'scripts/build-frontend-bundle.ps1'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DESKTOP_VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS tooling
        run: npm ci

      - name: UI tests
        run: |
          node --test test_chat_markdown.mjs test_verified_diff.mjs test_run_log_workspace.mjs test_run_stream.mjs test_project_flow.mjs
          node test_pannello_ragionamento.mjs

      - name: Stamp version
        run: >-
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.DESKTOP_VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');console.log('versione app: '+c.version)"

      - name: Build frontend bundle
        shell: pwsh
        run: ./scripts/build-frontend-bundle.ps1

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build installer
        run: npx tauri build --ci --bundles nsis

      - name: Collect installer
        id: installer
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($exe.Count -ne 1) { throw "atteso un solo installer, trovati $($exe.Count)" }
          $sha = (Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe[0].FullName "dist/$($exe[0].Name)"
          "path=dist/$($exe[0].Name)" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "$($exe[0].Name) $sha $($exe[0].Length) byte"

      - uses: actions/upload-artifact@v4
        with:
          name: devin-desktop-${{ env.DESKTOP_VERSION }}
          path: ${{ steps.installer.outputs.path }}
          retention-days: 14

      - name: Publish release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ steps.installer.outputs.path }}
          SHA256: ${{ steps.installer.outputs.sha256 }}
        run: |
          $tag = "desktop-v$env:DESKTOP_VERSION"
          $notes = "App desktop DEVIN $env:DESKTOP_VERSION da main ``$env:GITHUB_SHA``.`n`nInstaller SHA-256: ``$env:SHA256``"
          gh release create $tag $env:INSTALLER --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DEVIN desktop $env:DESKTOP_VERSION" --notes $notes
