# SearXNG locale per il backend/orchestratore del rig.
name: ai-rig-searxng-v2
services:
  searxng:
    image: searxng/searxng@sha256:854f239d5c181db9c4282cd0ffc1737a61232dd6ad0ea964028b96df17d7758a
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8081/
      # Limita i worker del server (servizio interno LAN, carico leggerissimo).
      # I nomi variano per versione: se ignorati non fa danno, il tetto vero e'
      # sotto (cpus/mem_limit).
      - SEARXNG_WORKERS=4
      - UWSGI_WORKERS=4
      - GRANIAN_WORKERS=4
    # SAFETY NET DURO (a livello container): anche se il processo generasse
    # decine di worker, NON puo' saturare il rig. Cap a 2 core e 1 GB.
    # Forma `deploy.resources.limits`: e' quella che `docker compose up` (v2)
    # onora davvero (le chiavi legacy cpus/mem_limit venivano IGNORATE nel tuo
    # setup -> il LIMIT restava = RAM host).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
